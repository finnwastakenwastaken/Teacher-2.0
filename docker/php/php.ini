; Application PHP settings. Loaded as conf.d/99-app.ini, so these win over
; the image defaults.

memory_limit = 256M

; Upload ceilings are deliberately modest. Large media never arrives as one
; request: the browser slices it into ~20 MB chunks (Cloudflare rejects bodies
; over 100 MB), and anything genuinely huge is registered from disk with
; `php artisan media:import` instead. Raising these will not make big uploads
; work through the tunnel.
upload_max_filesize = 32M
post_max_size = 40M
max_file_uploads = 30

max_execution_time = 120
max_input_time = 120

expose_php = Off

; Laravel manages its own sessions, but harden the PHP defaults regardless.
session.cookie_httponly = 1
session.cookie_samesite = "Lax"
session.use_strict_mode = 1

date.timezone = Europe/Amsterdam
