; Application PHP settings. Loaded as conf.d/99-app.ini, so these win over
; the image defaults.

memory_limit = 256M

; Modest on purpose: uploads arrive as ~20 MB chunks (Cloudflare rejects
; bodies over 100 MB); anything huge goes through `media:import` from disk
; instead. Raising these won't help big uploads through the tunnel.
upload_max_filesize = 32M
post_max_size = 40M
max_file_uploads = 30

max_execution_time = 120
max_input_time = 120

expose_php = Off

; Laravel manages its own sessions, but harden the PHP defaults regardless.
session.cookie_httponly = 1
session.cookie_samesite = "Lax"
session.use_strict_mode = 1

date.timezone = Europe/Amsterdam
