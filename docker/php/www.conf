; Pool sizing for a small single-server deployment (2 vCPU / 4 GB). Assumes
; PHP handles page rendering only — media streams via nginx's X-Accel-Redirect
; and doesn't consume workers here.

[www]
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

; Surface worker errors in `docker compose logs` rather than swallowing them.
catch_workers_output = yes
decorate_workers_output = no

; Used by the container healthcheck.
ping.path = /ping
ping.response = pong
