; PHP-FPM pool sizing for a small single-server deployment (2 vCPU / 4 GB).
;
; Sized on the assumption that PHP handles page rendering only. Media bytes are
; streamed by nginx via X-Accel-Redirect, so a class of students watching a
; video does not consume workers here. If that ever changes, this pool becomes
; the bottleneck long before the database does.

[www]
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

; Surface worker errors in `docker compose logs` rather than swallowing them.
catch_workers_output = yes
decorate_workers_output = no

; Used by the container healthcheck.
ping.path = /ping
ping.response = pong
