server {
    listen 80 default_server;
    server_name _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;

    # Chunked uploads send ~20 MB slices. Cloudflare's Free/Pro plans reject
    # any request body over 100 MB, which is the whole reason uploads are
    # chunked at all — keep this comfortably under that ceiling.
    client_max_body_size 40m;

    sendfile on;
    tcp_nopush on;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-XSS-Protection "0" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }

    # robots.txt is generated, not a file: the Sitemap: line has to carry an
    # absolute URL and behind the tunnel the domain is whatever Cloudflare
    # forwards. This block exists only to keep crawler noise out of the access
    # log, so it must still fall through to PHP — an exact-match location does
    # not inherit the try_files from `location /`, and without this line the
    # route 404s while every test passes.
    location = /robots.txt {
        access_log off;
        log_not_found off;
        try_files $uri /index.php?$query_string;
    }

    # Compiled assets are content-hashed by Vite, so they are safe to cache
    # permanently.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # -------------------------------------------------------------------------
    # Gated media.
    #
    # Laravel authorises the request first — is the page hidden, does the
    # visitor hold a valid password cookie — and only then returns an
    # X-Accel-Redirect header pointing into this location. nginx streams the
    # bytes with native Range support, so a student can scrub through a large
    # video without holding a PHP-FPM worker open for the whole playback.
    #
    # `internal` means this location cannot be requested directly from
    # outside. It is reachable only via a header Laravel emits. That is what
    # closes the side door: guessing a media URL gets you nothing.
    #
    # Never make this location public, and never serve storage/app/private
    # from any other location block.
    # -------------------------------------------------------------------------
    # Directory modes matter here: PHP-FPM writes these files as www-data
    # while nginx reads them as the nginx user, so the media directories are
    # created world-readable on purpose. See the `permissions` block on the
    # local disk in config/filesystems.php — with Flysystem's 0700 default,
    # nginx cannot traverse in and every request here becomes a 403.
    location /__media/ {
        internal;
        alias /var/www/html/storage/app/private/;
        # Accept-Ranges is set by nginx itself when it serves the file.
        add_header X-Content-Type-Options "nosniff" always;
    }

    # -------------------------------------------------------------------------
    # Backup archives.
    #
    # Same mechanism, different directory, and the separation is the point. An
    # archive contains the entire database — password hashes, every setting —
    # so it must never be reachable by the rules that govern media, where
    # anonymous visitors are allowed through for anything a public page shows.
    #
    # The only thing that can emit a redirect into here is
    # App\Http\Controllers\Admin\BackupController, which sits behind `auth`.
    # `internal` does the rest: this location cannot be requested from
    # outside, whatever anyone guesses.
    #
    # Do NOT merge this with /__media/ by pointing either at a shared parent.
    # The two exist separately so that widening one cannot widen the other.
    # -------------------------------------------------------------------------
    location /__backup/ {
        internal;
        alias /var/www/html/storage/app/backups/;
        add_header X-Content-Type-Options "nosniff" always;
    }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 300;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Deny dotfiles, but leave .well-known reachable.
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
