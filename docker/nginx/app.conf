# $realip_remote_addr, not $remote_addr: realip has already rewritten the
# latter by this point, so checking it would circularly ask whether the
# *claimed* address is trusted. These ranges are the tunnel and any
# host-local proxy; nothing else can reach nginx in either deployment.
geo $realip_remote_addr $from_trusted_proxy {
    default       0;
    10.0.0.0/8    1;
    172.16.0.0/12 1;
    192.168.0.0/16 1;
    127.0.0.0/8   1;
}

# cloudflared connects over plain HTTP after Cloudflare terminates TLS, so
# $scheme alone would say "http" on an HTTPS site. Honour the forwarded value,
# but only from a trusted proxy and only if it's literally http or https.
map "$from_trusted_proxy:$http_x_forwarded_proto" $forwarded_proto {
    default        $scheme;
    "~^1:(https?)$" $1;
}

server {
    listen 80 default_server;
    server_name _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;

    # Chunked uploads send ~20 MB slices. Cloudflare's Free/Pro plans reject
    # any request body over 100 MB, which is the whole reason uploads are
    # chunked at all — keep this comfortably under that ceiling.
    client_max_body_size 40m;

    sendfile on;
    tcp_nopush on;

    # Security headers, repeated verbatim in every location that sets its own
    # add_header (/build/, /__media/, /__backup/) — add_header doesn't merge,
    # so a location with one discards all inherited ones. Repeated rather than
    # `include`d because the dev compose file bind-mounts this single file; a
    # second, unmounted file would stop nginx from starting. Copy count is
    # pinned by tests/Feature/Security/SecurityHeaderTest.php.
    #
    # No HSTS: nginx never sees the TLS connection (Cloudflare terminates it),
    # and this same file serves http://localhost:8080 in dev, where HSTS would
    # lock out the browser until cleared by hand. It belongs at the Cloudflare
    # edge instead.
    #
    # CSP is defence in depth — TipTap JSON rendered as React, never HTML, is
    # what actually kills stored XSS. 'unsafe-inline' is for the inline theme
    # script in app.blade.php (avoids a flash of the wrong theme).
    #
    # The CSP is defence in depth, not the control that stops XSS — page
    # bodies are stored as TipTap JSON and rendered as React elements, never
    # as HTML, which is what actually eliminates the category. 'unsafe-inline'
    # is present because app.blade.php inlines the theme preference before
    # hydration to stop the page flashing the wrong theme.
    #
    # frame-src names exactly two hosts. youtube-nocookie is the privacy-
    # preserving YouTube host; tiktok.com is the plain iframe endpoint TikTok
    # serves, deliberately used instead of the blockquote-plus-script embed
    # their documentation recommends — that script would be a third party
    # running with full access to a page of teaching material, and would mean
    # widening script-src instead of frame-src. TikTok has no nocookie
    # equivalent, which is why the public renderer does not load it until a
    # student presses a button.
    #
    # instagram.com is deliberately ABSENT, and was removed after measuring
    # rather than assumed either way. Instagram's embed document contains no
    # video element at all — five images, a static play-button overlay and
    # links back to instagram.com, identical for /p/ and /reel/ — so framing
    # it would hand Meta a student's IP and cookies in exchange for a picture
    # they cannot watch. That block renders as a card that links out, and
    # nothing on the site frames instagram.com. Do not add it back without
    # re-measuring; see components/content/social-embed-frame.tsx.
    #
    # CSP_DEV_SRC and CSP_DEV_CONNECT are the Vite dev server, and they are
    # variables rather than literals because a CSP origin is resolved by
    # the *visitor's* browser: `http://localhost:5173` written here does not
    # mean the deploy machine, it means the student's own machine, and every
    # deployed site was telling every browser that scripts and styles from
    # whatever is listening on their port 5173 are permitted. That is an
    # erosion of the second line rather than a hole in the first, which is why
    # it was fixed rather than hotfixed — but "the origin does not exist on a
    # deployed machine", which this comment used to say, is simply not how
    # localhost resolves.
    #
    # This file is therefore an nginx *template*: the image copies it to
    # /etc/nginx/templates/default.conf.template, and the official entrypoint
    # runs envsubst over it at boot. The two variables default to empty in the
    # image (see the Dockerfile) and compose.dev.yaml fills them in, so one
    # file still serves both environments — which it has to, because the dev
    # stack bind-mounts this exact path and a second file that failed to mount
    # would stop nginx from starting.
    #
    # NGINX_ENVSUBST_FILTER is set to ^CSP_ in the image, and that is
    # load-bearing: envsubst replaces $VAR as well as ${VAR}, so without the
    # filter every $uri, $request_uri and $document_root below would be
    # substituted away by any environment variable that happened to share the
    # name.
    # -------------------------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-XSS-Protection "0" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), interest-cohort=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; frame-src https://www.youtube-nocookie.com https://www.tiktok.com; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self'${CSP_DEV_SRC}; style-src 'self' 'unsafe-inline'${CSP_DEV_SRC}; script-src 'self' 'unsafe-inline'${CSP_DEV_SRC}; connect-src 'self'${CSP_DEV_CONNECT}" always;

    # -------------------------------------------------------------------------
    # nginx passes every header through to PHP-FPM as HTTP_*, so without this
    # block a visitor's own forged X-Forwarded-For would defeat every per-IP
    # rate limit (login, unlock, claim) — confirmed: forged headers were never
    # throttled, a real single address was cut off after five attempts.
    #
    # `set_real_ip_from` names who may speak for someone else (the tunnel's
    # Docker network, loopback). CF-Connecting-IP is Cloudflare's own header
    # and carries a single address, so it can't be padded.
    #
    # Fronting with your own reverse proxy instead of the tunnel? Point
    # real_ip_header at X-Forwarded-For only if that proxy *replaces* the
    # header rather than appending to it — otherwise leave this alone and
    # accept one shared rate-limit bucket.
    # -------------------------------------------------------------------------
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.0/8;
    real_ip_header   CF-Connecting-IP;
    real_ip_recursive on;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }

    # robots.txt is generated, not a file: the Sitemap: line has to carry an
    # absolute URL and behind the tunnel the domain is whatever Cloudflare
    # forwards. This block exists only to keep crawler noise out of the access
    # log, so it must still fall through to PHP — an exact-match location does
    # not inherit the try_files from `location /`, and without this line the
    # route 404s while every test passes.
    location = /robots.txt {
        access_log off;
        log_not_found off;
        try_files $uri /index.php?$query_string;
    }

    # Compiled assets are content-hashed by Vite, so they are safe to cache
    # permanently.
    location /build/ {
        expires 1y;
        access_log off;
        try_files $uri =404;

        add_header Cache-Control "public, immutable";
        # Repeated because this block has an add_header of its own. See the
        # security-headers comment above.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-XSS-Protection "0" always;
        add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), interest-cohort=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; frame-src https://www.youtube-nocookie.com https://www.tiktok.com; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self'${CSP_DEV_SRC}; style-src 'self' 'unsafe-inline'${CSP_DEV_SRC}; script-src 'self' 'unsafe-inline'${CSP_DEV_SRC}; connect-src 'self'${CSP_DEV_CONNECT}" always;
    }

    # -------------------------------------------------------------------------
    # Gated media. Laravel authorises the request first, then returns an
    # X-Accel-Redirect pointing here; nginx streams the bytes with native
    # Range support, so scrubbing a large video doesn't hold a PHP-FPM worker
    # for the whole playback. `internal` means this can only be reached via
    # that header, never requested directly — never make it public or serve
    # storage/app/private from any other location.
    # -------------------------------------------------------------------------
    # PHP-FPM writes these files as www-data, nginx reads them as the nginx
    # user — see the `permissions` block in config/filesystems.php; Flysystem's
    # 0700 default would make them unreadable to nginx.
    location /__media/ {
        internal;
        alias /var/www/html/storage/app/private/;
        # Accept-Ranges is set by nginx itself. The rest are repeated per the
        # security-headers comment above.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-XSS-Protection "0" always;
        add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), interest-cohort=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'" always;
    }

    # -------------------------------------------------------------------------
    # Backup archives: same X-Accel mechanism, deliberately a separate
    # location from /__media/. An archive holds the whole database (password
    # hashes, every setting), so it must never be reachable by media's rules,
    # which let anonymous visitors through for anything a public page shows.
    # Only BackupController (behind `auth`) can emit a redirect here. Do not
    # merge this with /__media/ — widening one must not widen the other.
    # -------------------------------------------------------------------------
    location /__backup/ {
        internal;
        alias /var/www/html/storage/app/backups/;
        # Repeated, as above — an add_header here discards the inherited set.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-XSS-Protection "0" always;
        add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), interest-cohort=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'" always;
    }

    error_page 404 /index.php;

    location ~ \.php$ {
        # Only index.php exists in public/, so this matches nothing else
        # today. It stays because the block would happily execute any .php
        # path that did resolve, and "nothing else is there" is a property of
        # the current tree rather than a rule.
        try_files $uri =404;

        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;

        # Overwrite, never forward: whatever the visitor sent is replaced by
        # what nginx itself observed, so a forged header can't fool Laravel's
        # trustProxies or rewrite generated URLs (X-Forwarded-Host is also
        # untrusted on the Laravel side).
        fastcgi_param HTTP_X_FORWARDED_FOR   $remote_addr;
        fastcgi_param HTTP_X_FORWARDED_PROTO $forwarded_proto;
        fastcgi_param HTTP_X_FORWARDED_HOST  $host;

        # No X-Forwarded-Port: $server_port is nginx's internal listen port
        # (80), not what the visitor connected to. Setting it turned
        # https://host into https://host:80. The Host header already carries
        # the right port, so Laravel derives it from there instead.

        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 300;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Deny dotfiles, but leave .well-known reachable.
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
