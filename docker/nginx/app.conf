# -----------------------------------------------------------------------------
# Is the machine talking to us allowed to speak for someone else?
#
# $realip_remote_addr, not $remote_addr: the realip module has already
# rewritten the latter by the time this is evaluated, so asking about it would
# be asking whether the *claimed* address is trusted, which is circular.
#
# These are the private ranges the tunnel and any host-local proxy live on.
# Nothing outside them can reach nginx in either documented deployment — the
# tunnel opens no port at all, and the direct mode binds 127.0.0.1:8080.
# -----------------------------------------------------------------------------
geo $realip_remote_addr $from_trusted_proxy {
    default       0;
    10.0.0.0/8    1;
    172.16.0.0/12 1;
    192.168.0.0/16 1;
    127.0.0.0/8   1;
}

# The scheme the visitor actually used. Cloudflare terminates TLS and
# cloudflared then connects to us over plain HTTP, so $scheme alone would say
# "http" for every request on an HTTPS site and Laravel would generate http://
# URLs throughout. The forwarded value is therefore honoured — but only from a
# proxy in the list above, and only if it is literally http or https.
map "$from_trusted_proxy:$http_x_forwarded_proto" $forwarded_proto {
    default        $scheme;
    "~^1:(https?)$" $1;
}

server {
    listen 80 default_server;
    server_name _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;

    # Chunked uploads send ~20 MB slices. Cloudflare's Free/Pro plans reject
    # any request body over 100 MB, which is the whole reason uploads are
    # chunked at all — keep this comfortably under that ceiling.
    client_max_body_size 40m;

    sendfile on;
    tcp_nopush on;

    # -------------------------------------------------------------------------
    # Security headers.
    #
    # These are repeated verbatim in every location block that sets an
    # add_header of its own, because nginx's add_header does not merge: a
    # location with one add_header discards *every* inherited one. /build/,
    # /__media/ and /__backup/ each set one, so each was serving without the
    # rest of this list — silently, since nothing about the response looks
    # wrong. Repetition rather than an include because the dev stack bind-
    # mounts this single file (compose.dev.yaml) and a second file that failed
    # to be mounted would stop nginx from starting at all. The tripwire in
    # tests/Feature/Security/SecurityHeaderTest.php counts the copies.
    #
    # No Strict-Transport-Security here, deliberately. nginx listens on plain
    # 80 behind the tunnel and never sees the TLS connection, and the same
    # file serves http://localhost:8080 in development — an HSTS header on
    # localhost applies to every port on localhost and would make the dev site
    # unreachable in that browser until the operator cleared it by hand. HSTS
    # belongs at the edge that actually terminates TLS: Cloudflare has a
    # toggle for it under SSL/TLS → Edge Certificates, and the maintenance
    # guide says so.
    #
    # The CSP is defence in depth, not the control that stops XSS — page
    # bodies are stored as TipTap JSON and rendered as React elements, never
    # as HTML, which is what actually eliminates the category. 'unsafe-inline'
    # is present because app.blade.php inlines the theme preference before
    # hydration to stop the page flashing the wrong theme. frame-src is
    # youtube-nocookie because that is the only third party the site embeds.
    #
    # CSP_DEV_SRC and CSP_DEV_CONNECT are the Vite dev server, and they are
    # variables rather than literals because a CSP origin is resolved by
    # the *visitor's* browser: `http://localhost:5173` written here does not
    # mean the deploy machine, it means the student's own machine, and every
    # deployed site was telling every browser that scripts and styles from
    # whatever is listening on their port 5173 are permitted. That is an
    # erosion of the second line rather than a hole in the first, which is why
    # it was fixed rather than hotfixed — but "the origin does not exist on a
    # deployed machine", which this comment used to say, is simply not how
    # localhost resolves.
    #
    # This file is therefore an nginx *template*: the image copies it to
    # /etc/nginx/templates/default.conf.template, and the official entrypoint
    # runs envsubst over it at boot. The two variables default to empty in the
    # image (see the Dockerfile) and compose.dev.yaml fills them in, so one
    # file still serves both environments — which it has to, because the dev
    # stack bind-mounts this exact path and a second file that failed to mount
    # would stop nginx from starting.
    #
    # NGINX_ENVSUBST_FILTER is set to ^CSP_ in the image, and that is
    # load-bearing: envsubst replaces $VAR as well as ${VAR}, so without the
    # filter every $uri, $request_uri and $document_root below would be
    # substituted away by any environment variable that happened to share the
    # name.
    # -------------------------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-XSS-Protection "0" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), interest-cohort=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; frame-src https://www.youtube-nocookie.com; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self'${CSP_DEV_SRC}; style-src 'self' 'unsafe-inline'${CSP_DEV_SRC}; script-src 'self' 'unsafe-inline'${CSP_DEV_SRC}; connect-src 'self'${CSP_DEV_CONNECT}" always;

    # -------------------------------------------------------------------------
    # Who the client is, and who gets to say so.
    #
    # nginx passes every request header through to PHP-FPM as HTTP_*, so
    # without this block a visitor could simply type their own
    # `X-Forwarded-For` and Laravel would believe it. Every per-IP rate limit
    # in the application — login, unlock, claim — would then have an unbounded
    # number of buckets, which is to say none. That was demonstrated, not
    # theorised: ten login attempts with a rotating forged header were never
    # throttled, while ten from one address were cut off after five.
    #
    # So the client's value is discarded and nginx states what it actually
    # saw. $remote_addr is the peer, unless real_ip has replaced it using a
    # header from a proxy we trust.
    #
    # `set_real_ip_from` lists who is allowed to speak for someone else: the
    # Docker network the tunnel runs on, and loopback for a proxy sharing the
    # host. CF-Connecting-IP is Cloudflare's, and it carries one address
    # rather than a chain, so it cannot be padded.
    #
    # NOT USING THE TUNNEL? If your own reverse proxy sits in front, change
    # real_ip_header to X-Forwarded-For — but only if that proxy *replaces*
    # the header rather than appending to whatever the client sent. If you
    # are unsure, leave this alone: every visitor then shares one rate-limit
    # bucket, which is the safe way to be wrong.
    # -------------------------------------------------------------------------
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.0/8;
    real_ip_header   CF-Connecting-IP;
    real_ip_recursive on;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }

    # robots.txt is generated, not a file: the Sitemap: line has to carry an
    # absolute URL and behind the tunnel the domain is whatever Cloudflare
    # forwards. This block exists only to keep crawler noise out of the access
    # log, so it must still fall through to PHP — an exact-match location does
    # not inherit the try_files from `location /`, and without this line the
    # route 404s while every test passes.
    location = /robots.txt {
        access_log off;
        log_not_found off;
        try_files $uri /index.php?$query_string;
    }

    # Compiled assets are content-hashed by Vite, so they are safe to cache
    # permanently.
    location /build/ {
        expires 1y;
        access_log off;
        try_files $uri =404;

        add_header Cache-Control "public, immutable";
        # Repeated because this block has an add_header of its own. See the
        # security-headers comment above.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-XSS-Protection "0" always;
        add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), interest-cohort=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; frame-src https://www.youtube-nocookie.com; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self'${CSP_DEV_SRC}; style-src 'self' 'unsafe-inline'${CSP_DEV_SRC}; script-src 'self' 'unsafe-inline'${CSP_DEV_SRC}; connect-src 'self'${CSP_DEV_CONNECT}" always;
    }

    # -------------------------------------------------------------------------
    # Gated media.
    #
    # Laravel authorises the request first — is the page hidden, does the
    # visitor hold a valid password cookie — and only then returns an
    # X-Accel-Redirect header pointing into this location. nginx streams the
    # bytes with native Range support, so a student can scrub through a large
    # video without holding a PHP-FPM worker open for the whole playback.
    #
    # `internal` means this location cannot be requested directly from
    # outside. It is reachable only via a header Laravel emits. That is what
    # closes the side door: guessing a media URL gets you nothing.
    #
    # Never make this location public, and never serve storage/app/private
    # from any other location block.
    # -------------------------------------------------------------------------
    # Directory modes matter here: PHP-FPM writes these files as www-data
    # while nginx reads them as the nginx user, so the media directories are
    # created world-readable on purpose. See the `permissions` block on the
    # local disk in config/filesystems.php — with Flysystem's 0700 default,
    # nginx cannot traverse in and every request here becomes a 403.
    location /__media/ {
        internal;
        alias /var/www/html/storage/app/private/;
        # Accept-Ranges is set by nginx itself when it serves the file.
        #
        # The rest are repeated because this block has an add_header of its
        # own; before that, a video or a PDF served from here arrived without
        # X-Frame-Options or a Referrer-Policy. See the comment above.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-XSS-Protection "0" always;
        add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), interest-cohort=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'" always;
    }

    # -------------------------------------------------------------------------
    # Backup archives.
    #
    # Same mechanism, different directory, and the separation is the point. An
    # archive contains the entire database — password hashes, every setting —
    # so it must never be reachable by the rules that govern media, where
    # anonymous visitors are allowed through for anything a public page shows.
    #
    # The only thing that can emit a redirect into here is
    # App\Http\Controllers\Admin\BackupController, which sits behind `auth`.
    # `internal` does the rest: this location cannot be requested from
    # outside, whatever anyone guesses.
    #
    # Do NOT merge this with /__media/ by pointing either at a shared parent.
    # The two exist separately so that widening one cannot widen the other.
    # -------------------------------------------------------------------------
    location /__backup/ {
        internal;
        alias /var/www/html/storage/app/backups/;
        # Repeated, as above — an add_header here discards the inherited set.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-XSS-Protection "0" always;
        add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), interest-cohort=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'" always;
    }

    error_page 404 /index.php;

    location ~ \.php$ {
        # Only index.php exists in public/, so this matches nothing else
        # today. It stays because the block would happily execute any .php
        # path that did resolve, and "nothing else is there" is a property of
        # the current tree rather than a rule.
        try_files $uri =404;

        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;

        # Overwrite, never forward. These four decide who Laravel thinks the
        # visitor is, and the visitor does not get a vote: whatever they sent
        # is replaced by what nginx itself worked out. $remote_addr is the
        # peer, or the address a trusted proxy vouched for via real_ip;
        # $forwarded_proto honours an upstream https only from that same set
        # of proxies. X-Forwarded-Host is additionally not trusted at all on
        # the Laravel side, so a forged one cannot rewrite generated URLs.
        fastcgi_param HTTP_X_FORWARDED_FOR   $remote_addr;
        fastcgi_param HTTP_X_FORWARDED_PROTO $forwarded_proto;
        fastcgi_param HTTP_X_FORWARDED_HOST  $host;

        # No X-Forwarded-Port. $server_port is nginx's own listen port (80),
        # which is not the port the visitor connected to once a Docker port
        # mapping or the tunnel is in the way — setting it turned
        # http://localhost:8080 into http://localhost and https://host into
        # https://host:80. The Host header already carries the right port in
        # both deployments, so Laravel derives it from there; the header is
        # correspondingly untrusted in bootstrap/app.php.

        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 300;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Deny dotfiles, but leave .well-known reachable.
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
