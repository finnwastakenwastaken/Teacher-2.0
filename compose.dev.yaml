# Development overlay. Use with:
#   docker compose -f compose.yaml -f compose.dev.yaml up -d
#
# Differences from production: source is bind-mounted instead of baked into the
# image, opcache revalidates, dev composer packages are installed, and Vite
# runs as its own service with hot module replacement.

services:
  app:
    build:
      target: development
    environment:
      APP_ENV: local
      APP_DEBUG: 'true'
    volumes:
      - .:/var/www/html
      # node_modules and vendor live in named volumes rather than on the
      # bind mount. Thousands of small files over a Windows/macOS bind mount
      # are painfully slow, and the host does not need to read them.
      - vendor:/var/www/html/vendor
      - media:/var/www/html/storage/app/private

  web:
    build:
      target: web
    volumes:
      - ./public:/var/www/html/public
      - ./docker/nginx/app.conf:/etc/nginx/conf.d/default.conf:ro
      - media:/var/www/html/storage/app/private:ro

  # Vite runs on the application image, not a plain Node image.
  #
  # The Wayfinder plugin shells out to `php artisan wayfinder:generate` on
  # every dev-server start and on route changes, so the container running Vite
  # must have PHP, the vendor directory and a working Laravel install. A
  # node:alpine container fails immediately with "php: not found".
  vite:
    build:
      context: .
      target: development
    working_dir: /var/www/html
    entrypoint: []
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    ports:
      - '127.0.0.1:5173:5173'
    env_file:
      - .env
    environment:
      DB_HOST: database
      DB_PORT: 5432
    depends_on:
      - app
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
      - node_modules:/var/www/html/node_modules

  database:
    ports:
      # Exposed on loopback for local inspection with psql or a GUI client.
      # Deliberately not 5432 — Windows reserves parts of that range for
      # Hyper-V, and a local PostgreSQL install would collide too.
      - '127.0.0.1:55432:5432'

volumes:
  node_modules:
  vendor:
