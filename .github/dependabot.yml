version: 2

# Grouped and monthly rather than per-package and immediate.
#
# This is a single-teacher site that one person updates by running update.sh.
# A stream of individual pull requests would be noise nobody reads, and noise
# nobody reads is how a genuinely important one gets closed unopened. The
# `audit` job in tests.yml is what surfaces an actual CVE; these are the
# routine upgrades.
#
# `cooldown` is kept from the original file and extended to every ecosystem:
# it waits before opening a pull request for a brand-new release, which is the
# window in which a compromised package is usually caught and pulled.
#
# The @tiptap/* packages are grouped deliberately: v3 pins its peers exactly,
# so a single one at a caret range drags @tiptap/pm out of step and npm
# refuses the install. They move together or not at all.
updates:
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 5
    open-pull-requests-limit: 3
    groups:
      php:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 5
    open-pull-requests-limit: 3
    groups:
      tiptap:
        patterns:
          - "@tiptap/*"
      js:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 5
    groups:
      docker:
        patterns:
          - "*"
