<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Teacher 2.0 Live Demo</title>
    <style>
      :root {
        color-scheme: light dark;
      }

      body {
        margin: 0;
        font-family:
          Inter,
          system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          sans-serif;
        line-height: 1.5;
      }

      main {
        max-width: 860px;
        margin: 0 auto;
        padding: 2rem 1rem 3rem;
      }

      h1 {
        margin: 0 0 0.25rem;
      }

      .muted {
        opacity: 0.8;
      }

      .card {
        border: 1px solid color-mix(in srgb, currentColor 24%, transparent);
        border-radius: 10px;
        padding: 1rem;
        margin-top: 1rem;
      }

      ul {
        margin: 0.5rem 0 0;
        padding-left: 1.2rem;
      }

      a.button {
        display: inline-block;
        margin-top: 0.75rem;
        padding: 0.55rem 0.8rem;
        border-radius: 8px;
        border: 1px solid currentColor;
        text-decoration: none;
        font-weight: 600;
      }

      .screenshots {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 0.9rem;
      }

      figure {
        margin: 0;
      }

      img {
        width: 100%;
        border-radius: 8px;
        border: 1px solid color-mix(in srgb, currentColor 24%, transparent);
      }
    </style>
  </head>
  <body>
    <main>
      <h1 id="site-name">Teacher 2.0 Demo</h1>
      <p class="muted">
        Static portal hosted on GitHub Pages. Live app is hosted separately.
      </p>

      <section class="card">
        <h2>Live demo</h2>
        <p><a id="live-url" href="#">Open live demo</a></p>
        <p class="muted">
          If the link is down, check <a id="status-url" href="#">status page</a>.
        </p>
      </section>

      <section class="card">
        <h2>Access</h2>
        <p id="credentials-line">No public credentials are configured.</p>
      </section>

      <section class="card">
        <h2>Highlights</h2>
        <ul id="highlights"></ul>
      </section>

      <section class="card">
        <h2>Screenshots</h2>
        <div class="screenshots" id="screenshots"></div>
      </section>

      <section class="card">
        <h2>About this demo</h2>
        <ul id="notes"></ul>
        <p>
          Repository:
          <a id="repo-url" href="#">Teacher-2.0</a>
        </p>
      </section>
    </main>

    <script>
      async function loadPortal() {
        const response = await fetch('./demo-config.json', { cache: 'no-store' });
        const config = await response.json();

        const setText = (id, text) => {
          const element = document.getElementById(id);
          if (element) {
            element.textContent = text;
          }
        };

        const setLink = (id, href, text) => {
          const element = document.getElementById(id);
          if (element) {
            element.href = href;
            if (text) {
              element.textContent = text;
            }
          }
        };

        setText('site-name', config.siteName || 'Teacher 2.0 Demo');
        setLink('repo-url', config.repoUrl || '#', config.repoUrl || 'Repository');
        setLink('live-url', config.liveDemoUrl || '#', config.liveDemoUrl || 'Not set');
        setLink('status-url', config.statusPageUrl || '#', config.statusPageUrl || 'status page');

        if (config.credentials && config.credentials.enabled) {
          setText(
            'credentials-line',
            `${config.credentials.label}: ${config.credentials.username} (${config.credentials.passwordHint})`,
          );
        }

        const highlights = document.getElementById('highlights');
        (config.highlights || []).forEach((item) => {
          const li = document.createElement('li');
          li.textContent = item;
          highlights.appendChild(li);
        });

        const notes = document.getElementById('notes');
        (config.publicNotes || []).forEach((item) => {
          const li = document.createElement('li');
          li.textContent = item;
          notes.appendChild(li);
        });

        const screenshots = document.getElementById('screenshots');
        (config.screenshots || []).forEach((item) => {
          const figure = document.createElement('figure');
          const img = document.createElement('img');
          img.src = item.path;
          img.alt = item.title;
          const caption = document.createElement('figcaption');
          caption.className = 'muted';
          caption.textContent = item.title;

          figure.appendChild(img);
          figure.appendChild(caption);
          screenshots.appendChild(figure);
        });
      }

      loadPortal().catch((error) => {
        console.error(error);
      });
    </script>
  </body>
</html>
